name: Deploy Backend — Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner for GHCR
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/chat-pdf-backend:latest

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/chat-pdf-prod || {
              echo "Directory ~/chat-pdf-prod not found."
              echo "Run this on the VPS first:"
              echo "  mkdir -p ~/chat-pdf-prod"
              echo "  # Copy docker-compose.prod.yml and .env into that directory"
              exit 1
            }
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.OWNER_LC }}/chat-pdf-backend:latest
            docker compose -p chatpdf -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker exec chat_pdf_api alembic upgrade head
