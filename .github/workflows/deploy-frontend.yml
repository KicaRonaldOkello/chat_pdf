name: Deploy Frontend (staging + prod)

on:
  push:
    branches: [main, develop]

jobs:
  deploy-prod:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production
        run: npx ng build --configuration production
        working-directory: frontend

      - name: Deploy to production nginx root
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_SSH_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          source: frontend/dist/frontend/browser/*
          target: /var/www/understandingnotes
          strip_components: 4
          rm: true

  deploy-staging:
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build staging
        run: npx ng build --configuration staging
        working-directory: frontend

      - name: Deploy to staging nginx root
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: frontend/dist/frontend/browser/*
          target: /var/www/understandingnotes-staging
          strip_components: 4
          rm: true
