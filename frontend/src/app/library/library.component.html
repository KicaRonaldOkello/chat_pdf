<header class="main__header">
  <button
    mat-icon-button
    type="button"
    class="main__sidebar-toggle"
    (click)="toggleSidebar()"
    aria-label="Toggle sidebar"
  >
    <mat-icon>chevron_left</mat-icon>
  </button>
  <h1 class="main__title">Library</h1>
</header>
<div class="main__body">
  <div class="placeholder-page lumen-placeholder">
    <span class="material-symbols-outlined lumen-placeholder__icon" aria-hidden="true">menu_book</span>
    <h2 class="placeholder-page__title">Library</h2>
    <p class="placeholder-page__text">Saved documents will appear here.</p>
  </div>
</div>
